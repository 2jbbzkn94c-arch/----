<?xml version="1.0" encoding="UTF-8"?>
<!--
  酒馆纷争 · 封面背景 方案B：酒桌俯视（桌面刻着六边形棋盘）
  —— 与 方案A（酒馆内景·吧台）同一条管线，二者可互换。

  风格：粗黑描边 + 平涂暖色，与 assets/美术资源/角色 立绘一致。

  ⚠ 版式依据（tests/CoverLayoutProbe 实测的主菜单真实矩形）：
     标题「酒馆纷争」  y 252–319   x 90–630（文字实际约 x 260–460）
     副标题           y 335–358
     按钮列           y 398–964   x 90–630（不透明深藏青面板）
     底部Q群宣传行     y 1208–1260 x 290–702
  构图：酒桌铺满画面；光源是左下角的蜡烛（所以上暗下亮）
        → 标题压在暗木上（金字对比强），棋盘刻痕与桌上杂物全在可见区。
        棋盘 = 项目真实盘面 5列×7行 + 2格顶帽(奇列1,3)，大小 86/129/149。

  改完用 tools/RenderCover 重新栅格化成 酒桌封面.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">

  <defs>
    <!-- 桌面木色：上暗下亮（光源在下方） -->
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#2A1C12"/>
      <stop offset="0.18" stop-color="#3A2718"/>
      <stop offset="0.46" stop-color="#4A3320"/>
      <stop offset="0.72" stop-color="#5C3F27"/>
      <stop offset="1"    stop-color="#6B4A2F"/>
    </linearGradient>

    <!-- 房间地面（桌沿之外） -->
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0806"/>
      <stop offset="1" stop-color="#1A120C"/>
    </linearGradient>

    <!-- 烛光光池 -->
    <radialGradient id="candleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFE9BC" stop-opacity="0.90"/>
      <stop offset="0.22" stop-color="#FFC864" stop-opacity="0.44"/>
      <stop offset="0.58" stop-color="#E09432" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#E09432" stop-opacity="0"/>
    </radialGradient>

    <!-- 右上角窗缝冷光（补一点冷色，避免全暖） -->
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#8FAAD2" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#6A86B0" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#6A86B0" stop-opacity="0"/>
    </radialGradient>

    <!-- 中段压暗（按钮列背后要平） -->
    <linearGradient id="calm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0C0906" stop-opacity="0"/>
      <stop offset="0.20" stop-color="#0C0906" stop-opacity="0.34"/>
      <stop offset="0.82" stop-color="#0C0906" stop-opacity="0.34"/>
      <stop offset="1"    stop-color="#0C0906" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coolTint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#2E3A52" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#2E3A52" stop-opacity="0.20"/>
      <stop offset="0.80" stop-color="#2E3A52" stop-opacity="0.20"/>
      <stop offset="1"    stop-color="#2E3A52" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.42" cy="0.62" r="0.82">
      <stop offset="0.40" stop-color="#050403" stop-opacity="0"/>
      <stop offset="0.74" stop-color="#050403" stop-opacity="0.42"/>
      <stop offset="1"    stop-color="#050403" stop-opacity="0.90"/>
    </radialGradient>
  </defs>

