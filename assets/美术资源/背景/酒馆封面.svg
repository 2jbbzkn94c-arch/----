<?xml version="1.0" encoding="UTF-8"?>
<!--
  酒馆纷争 · 主菜单封面背景（720x1280 竖屏）
  风格：粗黑描边 + 平涂暖色，与 assets/美术资源/角色 立绘一致。

  ⚠ 版式依据（tests/CoverLayoutProbe 实测的主菜单真实矩形）：
     标题「酒馆纷争」  y 252–319   x 90–630（文字实际约 x 260–460）
     副标题           y 335–358
     按钮列           y 398–964   x 90–630（不透明深藏青面板）
     底部Q群宣传行     y 1208–1260 x 290–702
  因此：主体只能放在 y 0–250（顶部）、y 962–1200（底部），
        以及 y 398–964 的左右两条 90px 边距（x 0–90 / x 630–720）。
        按钮背后（y 330–1000 中部）必须压暗压平，否则按钮缝里会花。

  改完用 tools/RenderCover 重新栅格化成 酒馆封面.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#4A3524"/>
      <stop offset="0.15" stop-color="#38271A"/>
      <stop offset="0.40" stop-color="#241A13"/>
      <stop offset="0.74" stop-color="#1B1410"/>
      <stop offset="1"    stop-color="#2E2015"/>
    </linearGradient>

    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFE4AC" stop-opacity="0.85"/>
      <stop offset="0.32" stop-color="#FFC062" stop-opacity="0.36"/>
      <stop offset="0.70" stop-color="#E89432" stop-opacity="0.11"/>
      <stop offset="1"    stop-color="#E89432" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="barGlow" cx="0.5" cy="1" r="0.6">
      <stop offset="0"   stop-color="#FFCE7A" stop-opacity="0.36"/>
      <stop offset="0.5" stop-color="#E09040" stop-opacity="0.14"/>
      <stop offset="1"   stop-color="#E09040" stop-opacity="0"/>
    </radialGradient>

    <!-- 中段压暗：上下两端渐隐，不留硬边 -->
    <linearGradient id="calm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0D0A07" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#0D0A07" stop-opacity="0.46"/>
      <stop offset="0.84" stop-color="#0D0A07" stop-opacity="0.46"/>
      <stop offset="1"    stop-color="#0D0A07" stop-opacity="0"/>
    </linearGradient>

    <!-- 中段冷色薄纱：让深藏青按钮面板与暖木背景过渡自然 -->
    <linearGradient id="coolTint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#2E3A52" stop-opacity="0"/>
      <stop offset="0.2"  stop-color="#2E3A52" stop-opacity="0.20"/>
      <stop offset="0.8"  stop-color="#2E3A52" stop-opacity="0.20"/>
      <stop offset="1"    stop-color="#2E3A52" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0705" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0A0705" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.44" r="0.8">
      <stop offset="0.44" stop-color="#070503" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#070503" stop-opacity="0.40"/>
      <stop offset="1"    stop-color="#070503" stop-opacity="0.88"/>
    </radialGradient>

    <linearGradient id="barTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A6E40"/>
      <stop offset="1" stop-color="#5C3E26"/>
    </linearGradient>
    <linearGradient id="barFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E361F"/>
      <stop offset="1" stop-color="#291B10"/>
    </linearGradient>

    <!-- 剪影统一外描边：形状先用粗描边画一遍，再用纯填充盖掉内部接缝 -->
    <g id="silL">
      <path d="M-12 1292 L-12 1150 C-12 1088 26 1050 86 1044 C136 1040 172 1074 178 1132 L186 1292 Z"/>
      <circle cx="80" cy="1004" r="52"/>
    </g>
    <g id="silR">
      <path d="M732 1292 L732 1104 C732 1042 694 1006 638 1006 C582 1006 552 1042 548 1102 L540 1292 Z"/>
      <circle cx="642" cy="962" r="51"/>
    </g>
  </defs>

  <!-- ================= 1. 墙面 ================= -->
  <rect x="0" y="0" width="720" height="1280" fill="url(#wall)"/>
  <g stroke="#150F0A" stroke-width="4" opacity="0.42">
    <line x1="132" y1="140" x2="132" y2="1020"/>
    <line x1="264" y1="140" x2="264" y2="1020"/>
    <line x1="396" y1="140" x2="396" y2="1020"/>
    <line x1="528" y1="140" x2="528" y2="1020"/>
    <line x1="648" y1="140" x2="648" y2="1020"/>
  </g>

  <!-- 灯光晕（两盏吊灯左右夹住标题 + 吧台向上打光） -->
  <circle cx="94"  cy="286" r="190" fill="url(#lampGlow)"/>
  <circle cx="628" cy="286" r="182" fill="url(#lampGlow)"/>
  <circle cx="360" cy="1150" r="430" fill="url(#barGlow)"/>

  <!-- ================= 2. 顶部横梁 ================= -->
  <rect x="0" y="0" width="720" height="72" fill="#3C2717" stroke="#1B120B" stroke-width="6"/>
  <rect x="0" y="5" width="720" height="12" fill="#6B4A2F" opacity="0.5"/>
  <g stroke="#241608" stroke-width="3" opacity="0.65">
    <line x1="0" y1="34" x2="720" y2="34"/>
    <line x1="0" y1="52" x2="720" y2="52"/>
    <line x1="0" y1="66" x2="720" y2="66"/>
  </g>
  <rect x="0" y="72" width="720" height="64" fill="url(#beamShadow)"/>
  <!-- 铁箍 + 金铆钉 -->
  <g fill="#2A2A30" stroke="#15100B" stroke-width="5">
    <rect x="404" y="60" width="42" height="24" rx="3"/>
    <rect x="196" y="88" width="42" height="24" rx="3"/>
  </g>
  <g fill="#C9963C" stroke="#15100B" stroke-width="3">
    <circle cx="414" cy="72" r="5.5"/><circle cx="436" cy="72" r="5.5"/>
    <circle cx="206" cy="100" r="5.5"/><circle cx="228" cy="100" r="5.5"/>
  </g>

  <!-- 左侧第二根短梁 -->
  <rect x="0" y="100" width="248" height="46" fill="#33210F" stroke="#1B120B" stroke-width="6"/>
  <rect x="0" y="104" width="248" height="9" fill="#5E4026" opacity="0.45"/>
  <line x1="0" y1="130" x2="248" y2="130" stroke="#241608" stroke-width="3" opacity="0.65"/>

  <!-- ================= 3. 挂牌（正中，六边形战棋徽记） ================= -->
  <g stroke="#3A2A1E" stroke-width="5">
    <line x1="304" y1="72" x2="304" y2="102"/>
    <line x1="416" y1="72" x2="416" y2="102"/>
  </g>
  <rect x="262" y="98" width="196" height="146" rx="12" fill="#4E3520" stroke="#1B120B" stroke-width="7"/>
  <rect x="274" y="110" width="172" height="122" rx="8" fill="none" stroke="#6B4A2F" stroke-width="3" opacity="0.55"/>
  <!-- 金六边形 + 交叉刀剑 -->
  <path d="M360 122 L404 147 L404 197 L360 222 L316 197 L316 147 Z" fill="none" stroke="#FFD980" stroke-width="6"/>
  <g stroke="#C9963C" stroke-width="7" stroke-linecap="round">
    <line x1="336" y1="150" x2="384" y2="194"/>
    <line x1="336" y1="194" x2="384" y2="150"/>
  </g>
  <g fill="#C9963C" stroke="#15100B" stroke-width="3">
    <circle cx="276" cy="112" r="5"/><circle cx="444" cy="112" r="5"/>
  </g>

  <!-- ================= 4. 吊灯 ×2（左右夹住标题） ================= -->
  <!-- 左：挂在短梁下 -->
  <line x1="94" y1="146" x2="94" y2="230" stroke="#2A2A30" stroke-width="5"/>
  <circle cx="94" cy="236" r="8" fill="none" stroke="#C9963C" stroke-width="5"/>
  <path d="M66 244 L122 244 L114 266 L74 266 Z" fill="#2A2A30" stroke="#15100B" stroke-width="5"/>
  <path d="M74 266 L114 266 L107 326 L81 326 Z" fill="#FFCE7A" stroke="#15100B" stroke-width="5"/>
  <ellipse cx="94" cy="296" rx="9" ry="15" fill="#FFF6D2"/>
  <rect x="76" y="326" width="36" height="14" rx="3" fill="#2A2A30" stroke="#15100B" stroke-width="5"/>
  <!-- 右：挂在主梁下 -->
  <line x1="628" y1="72" x2="628" y2="230" stroke="#2A2A30" stroke-width="5"/>
  <circle cx="628" cy="236" r="8" fill="none" stroke="#C9963C" stroke-width="5"/>
  <path d="M602 244 L654 244 L647 265 L609 265 Z" fill="#2A2A30" stroke="#15100B" stroke-width="5"/>
  <path d="M609 265 L647 265 L641 322 L615 322 Z" fill="#FFCE7A" stroke="#15100B" stroke-width="5"/>
  <ellipse cx="628" cy="294" rx="8" ry="14" fill="#FFF6D2"/>
  <rect x="611" y="322" width="34" height="13" rx="3" fill="#2A2A30" stroke="#15100B" stroke-width="5"/>

  <!-- ================= 5. 按钮列背后的中段压暗 ================= -->
  <rect x="0" y="330" width="720" height="670" fill="url(#calm)"/>
  <rect x="0" y="330" width="720" height="670" fill="url(#coolTint)"/>

  <!-- ================= 6. 两条 90px 边距里的小装饰（按钮列两侧唯一露出的背景） ================= -->
  <!-- 左：歪钉的通缉令 -->
  <g transform="rotate(-6 46 500)" opacity="0.92">
    <rect x="6" y="428" width="80" height="140" rx="5" fill="#7C6849" stroke="#1B120B" stroke-width="5"/>
    <rect x="14" y="436" width="64" height="124" rx="3" fill="none" stroke="#4A3A26" stroke-width="3" opacity="0.6"/>
    <circle cx="46" cy="462" r="13" fill="none" stroke="#3A2A1E" stroke-width="4"/>
    <g stroke="#3A2A1E" stroke-width="4" stroke-linecap="round">
      <line x1="20" y1="492" x2="72" y2="492"/>
      <line x1="20" y1="506" x2="72" y2="506"/>
      <line x1="20" y1="520" x2="56" y2="520"/>
    </g>
    <circle cx="14" cy="436" r="4.5" fill="#C9963C" stroke="#15100B" stroke-width="2.5"/>
  </g>
  <!-- 右：墙上挂钩吊着两只木杯 -->
  <g opacity="0.95">
    <line x1="646" y1="470" x2="712" y2="470" stroke="#3A2A1E" stroke-width="6"/>
    <g fill="none" stroke="#3A2A1E" stroke-width="4">
      <path d="M666 470 C666 484 660 488 660 496"/>
      <path d="M696 470 C696 484 690 488 690 496"/>
    </g>
    <path d="M648 502 L676 502 L672 546 L652 546 Z" fill="#6B4A2F" stroke="#15100B" stroke-width="5"/>
    <path d="M678 508 C692 510 694 526 679 530" fill="none" stroke="#15100B" stroke-width="5"/>
    <path d="M684 528 L710 528 L707 560 L687 560 Z" fill="#5C3E26" stroke="#15100B" stroke-width="5"/>
  </g>

  <!-- ================= 7. 浮尘 ================= -->
  <g fill="#FFE3A8">
    <circle cx="40"  cy="86"  r="3"   opacity="0.22"/>
    <circle cx="180" cy="196" r="2.4" opacity="0.18"/>
    <circle cx="540" cy="180" r="3"   opacity="0.20"/>
    <circle cx="690" cy="150" r="2.2" opacity="0.16"/>
    <circle cx="60"  cy="640" r="2.6" opacity="0.16"/>
    <circle cx="678" cy="700" r="2.4" opacity="0.14"/>
    <circle cx="48"  cy="880" r="2.2" opacity="0.13"/>
    <circle cx="686" cy="880" r="2.8" opacity="0.13"/>
    <circle cx="238" cy="700" r="2.6" opacity="0.12"/>
    <circle cx="470" cy="760" r="2.2" opacity="0.11"/>
    <circle cx="210" cy="986" r="3"   opacity="0.20"/>
    <circle cx="316" cy="1010" r="2.4" opacity="0.15"/>
    <circle cx="600" cy="1000" r="3.2" opacity="0.17"/>
    <circle cx="392" cy="1120" r="2.4" opacity="0.12"/>
  </g>

  <!-- ================= 8. 吧台（底部 y962–1200 是完整可见区） ================= -->
  <rect x="0" y="1020" width="720" height="58" fill="url(#barTop)" stroke="#1B120B" stroke-width="6"/>
  <rect x="0" y="1020" width="720" height="10" fill="#BE8E52" opacity="0.7"/>
  <g stroke="#4E3520" stroke-width="3" opacity="0.5">
    <line x1="0" y1="1044" x2="720" y2="1044"/>
    <line x1="0" y1="1064" x2="720" y2="1064"/>
  </g>
  <rect x="0" y="1074" width="720" height="206" fill="url(#barFront)" stroke="#1B120B" stroke-width="6"/>
  <g stroke="#150F0A" stroke-width="5" opacity="0.5">
    <line x1="96"  y1="1074" x2="96"  y2="1280"/>
    <line x1="192" y1="1074" x2="192" y2="1280"/>
    <line x1="288" y1="1074" x2="288" y2="1280"/>
    <line x1="384" y1="1074" x2="384" y2="1280"/>
    <line x1="480" y1="1074" x2="480" y2="1280"/>
    <line x1="576" y1="1074" x2="576" y2="1280"/>
    <line x1="672" y1="1074" x2="672" y2="1280"/>
  </g>
  <rect x="0" y="1146" width="720" height="26" fill="#2A2A30" stroke="#15100B" stroke-width="5"/>
  <g fill="#C9963C" stroke="#15100B" stroke-width="3">
    <circle cx="64"  cy="1159" r="6.5"/>
    <circle cx="186" cy="1159" r="6.5"/>
    <circle cx="308" cy="1159" r="6.5"/>
    <circle cx="430" cy="1159" r="6.5"/>
    <circle cx="552" cy="1159" r="6.5"/>
    <circle cx="674" cy="1159" r="6.5"/>
  </g>

  <!-- ================= 9. 台面物件 ================= -->
  <!-- 烛台（中左，火苗顶到 y≈966，压在按钮列下方不打挤） -->
  <circle cx="230" cy="992" r="126" fill="url(#lampGlow)"/>
  <path d="M204 1056 L258 1056 L250 1016 L212 1016 Z" fill="#2A2A30" stroke="#15100B" stroke-width="5"/>
  <rect x="219" y="996" width="24" height="24" fill="#E8D7B0" stroke="#15100B" stroke-width="5"/>
  <path d="M231 962 C245 979 238 996 231 1000 C224 996 217 979 231 962 Z" fill="#FFC864" stroke="#15100B" stroke-width="4"/>
  <ellipse cx="231" cy="986" rx="4" ry="8" fill="#FFF6D2"/>

  <!-- 酒杯 ×3 -->
  <path d="M296 1010 L346 1010 L341 1058 L301 1058 Z" fill="#B98A55" stroke="#15100B" stroke-width="6"/>
  <ellipse cx="321" cy="1010" rx="25" ry="9" fill="#FFF3C4" stroke="#15100B" stroke-width="5"/>
  <path d="M348 1018 C366 1020 368 1040 350 1044" fill="none" stroke="#15100B" stroke-width="6"/>
  <path d="M372 1024 L412 1024 L408 1058 L376 1058 Z" fill="#B98A55" stroke="#15100B" stroke-width="6"/>
  <ellipse cx="392" cy="1024" rx="20" ry="7.5" fill="#FFF3C4" stroke="#15100B" stroke-width="5"/>
  <path d="M414 1030 C428 1032 430 1046 416 1050" fill="none" stroke="#15100B" stroke-width="6"/>
  <path d="M424 1042 L456 1042 L452 1058 L428 1058 Z" fill="#8A6238" stroke="#15100B" stroke-width="6"/>

  <!-- 散落金币 -->
  <g fill="#FFD980" stroke="#15100B" stroke-width="3">
    <ellipse cx="298" cy="1068" rx="10" ry="5.5"/>
    <ellipse cx="318" cy="1072" rx="10" ry="5.5"/>
    <ellipse cx="466" cy="1070" rx="10" ry="5.5"/>
  </g>

  <!-- 酒桶（中右）：桶身中段外鼓 + 细箍 + 桶板竖纹，避免读成"叠起来的盘子" -->
  <circle cx="502" cy="1010" r="104" fill="url(#lampGlow)" opacity="0.5"/>
  <ellipse cx="502" cy="958" rx="41" ry="10" fill="#5C3E26" stroke="#1B120B" stroke-width="6"/>
  <path d="M463 958 L541 958 C556 984 556 1042 541 1066 L463 1066 C448 1042 448 984 463 958 Z"
        fill="#4E3520" stroke="#1B120B" stroke-width="6"/>
  <g stroke="#33220F" stroke-width="4" opacity="0.55">
    <line x1="478" y1="964" x2="474" y2="1062"/>
    <line x1="502" y1="962" x2="502" y2="1064"/>
    <line x1="526" y1="964" x2="530" y2="1062"/>
  </g>
  <g fill="none" stroke="#2A2A30" stroke-width="9">
    <path d="M458 988 C454 992 454 1000 458 1004 L546 1004 C550 1000 550 992 546 988 Z"/>
    <path d="M452 1030 C448 1034 448 1042 452 1046 L552 1046 C556 1042 556 1034 552 1030 Z"/>
  </g>
  <rect x="492" y="1048" width="20" height="16" rx="4" fill="#C9963C" stroke="#15100B" stroke-width="4"/>

  <!-- ================= 10. 前景剪影（左右裁切，做景深框） ================= -->
  <!-- 先粗描边层（统合外轮廓），再纯填充层（盖掉内部接缝） -->
  <g fill="#0F0B07" stroke="#060403" stroke-width="16" stroke-linejoin="round">
    <use href="#silL"/>
    <use href="#silR"/>
  </g>
  <g fill="#0F0B07" stroke="none">
    <use href="#silL"/>
    <use href="#silR"/>
  </g>
  <!-- 轮廓暖光改为贴边内亮：改由暗角与吧台暖光提供体积感，避免出现"飘在边上的黄线" -->

  <!-- ================= 11. 暗角 ================= -->
  <rect x="0" y="0" width="720" height="1280" fill="url(#vignette)"/>

</svg>
